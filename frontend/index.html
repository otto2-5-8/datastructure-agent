<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>看懂每一步 · 二分查找工作台</title>
  <link rel="stylesheet" href="/src/styles/workbench.css">
  <link rel="stylesheet" href="/src/features/visualization/visualization.css">
  <!-- 03 的 UI 成果入口样式（03 自己的文件；02 的 workbench.css 不动） -->
  <link rel="stylesheet" href="/src/features/visualization/ui-entry.css?v=20261030a">
  <link rel="stylesheet" href="/src/features/agent/chat.css">
  <link rel="stylesheet" href="/src/features/exercises/exercises.css">
</head>
<body>
  <main>
    <header class="page-header"><div><p class="eyebrow">数据结构与算法学习助手</p><h1>看懂每一步</h1><p>从一次比较，理解二分查找。</p></div><a class="ui-entry" href="/src/features/visualization/dev-morph.html" title="03 交付的 UI：代码显示 / 算法可视化窗口 / 步骤辅导 / 过程练习 / 本机记录">03 的 UI 成果 · 五区工作台 →</a><span id="service-status" role="status">正在连接服务…</span></header>
    <form id="run-form" class="input-panel" aria-label="创建二分查找运行">
      <label class="array-field" for="arrInput">有序数组<input id="arrInput" name="array" type="text" autocomplete="off" placeholder="例如：1, 3, 5, 7, 9" aria-describedby="input-help msgBox"></label>
      <label for="targetInput">目标值<input id="targetInput" name="target" type="text" inputmode="numeric" autocomplete="off" placeholder="例如：7" aria-describedby="msgBox"></label>
      <div class="input-actions"><button id="fillDemo" type="button" class="secondary">填入示例</button><button id="startBtn" type="submit">开始分析</button></div>
      <p id="input-help" class="muted">输入最多 100 个非递减排列的安全整数，用逗号分隔；留空表示空数组。允许负数和重复值。</p>
      <p id="msgBox" role="status" aria-live="polite"></p>
    </form>
    <div class="workspace">
      <section class="panel visualization-region" aria-labelledby="viz-title"><header class="panel-heading"><h2 id="viz-title">执行过程</h2><span id="stepText">尚未开始</span></header><div id="visualization-panel" tabindex="0" aria-label="数组动画，可用左右方向键单步操作"><p class="empty-state">填入示例，开始观察每一步。</p></div><p id="step-description" aria-live="polite"></p>
        <div class="playback-controls" aria-label="播放控制"><button id="prevBtn" type="button" class="secondary" disabled>上一步</button><button id="playBtn" type="button" disabled>播放</button><button id="nextBtn" type="button" class="secondary" disabled>下一步</button><button id="resetBtn" type="button" class="secondary" disabled>重置</button><label for="speedSelect">速度<select id="speedSelect"><option value="2000">2 秒/步</option><option value="1000" selected>1 秒/步</option><option value="500">0.5 秒/步</option><option value="250">0.25 秒/步</option></select></label></div>
        <p class="muted shortcut-help">聚焦动画区：← 上一步，→ 下一步，空格播放或暂停。重置返回第 1 步。</p>
      </section>
      <section id="code-panel" class="panel code-region" aria-labelledby="code-title"><header class="panel-heading"><h2 id="code-title">代码与变量</h2><span id="source-version" class="muted">C/C++</span></header><dl class="variables"><div><dt>left</dt><dd id="varLeft">—</dd></div><div><dt>right</dt><dd id="varRight">—</dd></div><div><dt>mid</dt><dd id="varMid">未计算</dd></div><div><dt>A[mid]</dt><dd id="varValue">—</dd></div></dl><ol id="code-lines" class="source-lines" aria-label="C/C++ 展示代码"><li>开始分析后显示对应源码。</li></ol></section>
      <section class="panel agent-region" aria-label="步骤辅导"><div id="agent-panel" class="chat-container embedded"></div></section>
    </div>
    <section id="exercise-panel" class="panel exercise-region" aria-labelledby="exercise-title"><h2 id="exercise-title">练习与学习记录</h2><p id="exercise-context">当前无工作台运行，可独立完成固定题练习。</p><div id="exercise-mount"></div></section>
  </main>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
